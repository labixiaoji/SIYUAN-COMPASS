# 89 origin: school proxy strips /shengya/; browser URLs retain it.
# Install in conf.d and disable the distribution default site.
map $http_x_forwarded_proto $siyuan_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai4edu.sjtu.edu.cn;
    root /opt/SIYUAN-COMPASS/frontend/dist;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
        # Preserve /api/ in the upstream request.
        proxy_pass http://127.0.0.1:18120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $siyuan_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /shengya;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
